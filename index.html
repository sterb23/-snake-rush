<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Fixed Spawn</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  height: 100%;
  background: #000;
  touch-action: none;
  font-family: Arial;
  color: white;
}

canvas {
  display: block;
  margin: auto;
  background: #000;
  border: 2px solid #00ffcc;
  box-shadow: 0 0 20px #00ffcc;
}

#ui {
  position: absolute;
  top: 10px;
  left: 10px;
}
</style>
</head>

<body>

<div id="ui">
Score: <span id="score">0</span>
</div>

<canvas id="game"></canvas>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const box = 20;

let cols, rows;
let snake, food, dir, score = 0;
let loop;

/* 🔥 SAFE RESIZE FIRST */
function resize() {
  canvas.width = Math.floor(window.innerWidth / box) * box;
  canvas.height = Math.floor(window.innerHeight / box) * box;

  cols = canvas.width / box;
  rows = canvas.height / box;
}

window.addEventListener("resize", resize);
resize();

/* ✅ SAFE SPAWN (ONLY AFTER RESIZE) */
function init() {
  const startX = Math.floor(cols / 2);
  const startY = Math.floor(rows / 2);

  snake = [{
    x: startX * box,
    y: startY * box
  }];

  dir = "RIGHT";
  score = 0;

  food = spawnFood();

  document.getElementById("score").innerText = score;
}

/* FOOD SAFE */
function spawnFood() {
  return {
    x: Math.floor(Math.random() * cols) * box,
    y: Math.floor(Math.random() * rows) * box
  };
}

/* CONTROLS */
document.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft") dir = "LEFT";
  if (e.key === "ArrowRight") dir = "RIGHT";
  if (e.key === "ArrowUp") dir = "UP";
  if (e.key === "ArrowDown") dir = "DOWN";
});

/* GAME LOOP */
function game() {

  ctx.fillStyle = "rgba(0,0,0,0.35)";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  let head = {...snake[0]};

  if (dir === "RIGHT") head.x += box;
  if (dir === "LEFT") head.x -= box;
  if (dir === "UP") head.y -= box;
  if (dir === "DOWN") head.y += box;

  /* WALLS */
  if (
    head.x < 0 ||
    head.y < 0 ||
    head.x >= canvas.width ||
    head.y >= canvas.height
  ) return die();

  /* SELF */
  for (let s of snake) {
    if (s.x === head.x && s.y === head.y) return die();
  }

  snake.unshift(head);

  /* EAT */
  if (head.x === food.x && head.y === food.y) {
    score++;
    food = spawnFood();
  } else {
    snake.pop();
  }

  drawGrid();
  drawSnake();
  drawFood();

  document.getElementById("score").innerText = score;
}

/* GRID */
function drawGrid() {
  ctx.strokeStyle = "rgba(0,255,204,0.15)";

  for (let i = 0; i <= canvas.width; i += box) {
    ctx.beginPath();
    ctx.moveTo(i,0);
    ctx.lineTo(i,canvas.height);
    ctx.stroke();
  }

  for (let i = 0; i <= canvas.height; i += box) {
    ctx.beginPath();
    ctx.moveTo(0,i);
    ctx.lineTo(canvas.width,i);
    ctx.stroke();
  }
}

/* SNAKE */
function drawSnake() {
  ctx.lineWidth = 14;
  ctx.lineCap = "round";
  ctx.strokeStyle = "#00ffcc";
  ctx.shadowBlur = 15;
  ctx.shadowColor = "#00ffcc";

  ctx.beginPath();

  for (let i = 0; i < snake.length; i++) {
    let s = snake[i];
    if (i === 0) ctx.moveTo(s.x + box/2, s.y + box/2);
    else ctx.lineTo(s.x + box/2, s.y + box/2);
  }

  ctx.stroke();
  ctx.shadowBlur = 0;
}

/* FOOD */
function drawFood() {
  ctx.fillStyle = "#ff4444";
  ctx.beginPath();
  ctx.arc(food.x + box/2, food.y + box/2, 8, 0, Math.PI*2);
  ctx.fill();
}

/* DIE */
function die() {
  clearInterval(loop);
  alert("Game Over!");
  start();
}

/* START */
function start() {
  resize();   // 🔥 IMPORTANT FIX
  init();     // 🔥 SAFE NOW
  loop = setInterval(game, 120);
}

start();

</script>

</body>
</html>
