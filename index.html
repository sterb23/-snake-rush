<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Snake Game Ultimate</title>
<style>
  body {
    margin: 0;
    background: #111;
    display: flex;
    flex-direction: column;
    align-items: center;
    font-family: Arial;
    color: white;
  }

  canvas {
    background: black;
    border: 2px solid #0f0;
    margin-top: 10px;
  }

  .hud {
    display: flex;
    gap: 20px;
    margin-top: 10px;
  }

  button {
    padding: 8px 14px;
    background: #0f0;
    border: none;
    cursor: pointer;
    font-weight: bold;
  }

  .controls {
    margin-top: 10px;
    display: grid;
    grid-template-columns: repeat(3, 60px);
    gap: 5px;
  }

  .controls button {
    width: 60px;
    height: 60px;
    font-size: 18px;
  }
</style>
</head>
<body>

<h2>🐍 Snake Game</h2>

<div class="hud">
  <div>Score: <span id="score">0</span></div>
  <div>High: <span id="high">0</span></div>
</div>

<canvas id="game" width="400" height="400"></canvas>

<div class="hud">
  <button onclick="restart()">Restart</button>
  <button onclick="togglePause()">Pause</button>
</div>

<div class="controls">
  <div></div>
  <button onclick="setDir('UP')">⬆️</button>
  <div></div>

  <button onclick="setDir('LEFT')">⬅️</button>
  <button onclick="setDir('DOWN')">⬇️</button>
  <button onclick="setDir('RIGHT')">➡️</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const box = 20;
let snake, food, direction, score, high, game, speed, paused;

high = localStorage.getItem("snakeHigh") || 0;
document.getElementById("high").innerText = high;

function init() {
  snake = [{ x: 9 * box, y: 9 * box }];
  direction = "RIGHT";
  score = 0;
  speed = 150;
  paused = false;

  food = randomFood();

  document.getElementById("score").innerText = score;

  clearInterval(game);
  game = setInterval(draw, speed);
}

function randomFood() {
  return {
    x: Math.floor(Math.random() * 20) * box,
    y: Math.floor(Math.random() * 20) * box
  };
}

function setDir(dir) {
  if (dir === "LEFT" && direction !== "RIGHT") direction = dir;
  if (dir === "RIGHT" && direction !== "LEFT") direction = dir;
  if (dir === "UP" && direction !== "DOWN") direction = dir;
  if (dir === "DOWN" && direction !== "UP") direction = dir;
}

document.addEventListener("keydown", e => {
  if (e.key === " ") return togglePause();

  const k = e.keyCode;
  if (k === 37) setDir("LEFT");
  if (k === 38) setDir("UP");
  if (k === 39) setDir("RIGHT");
  if (k === 40) setDir("DOWN");
});

// Swipe controls
let startX, startY;
document.addEventListener("touchstart", e => {
  startX = e.touches[0].clientX;
  startY = e.touches[0].clientY;
});

document.addEventListener("touchend", e => {
  let dx = e.changedTouches[0].clientX - startX;
  let dy = e.changedTouches[0].clientY - startY;

  if (Math.abs(dx) > Math.abs(dy)) {
    if (dx > 0) setDir("RIGHT");
    else setDir("LEFT");
  } else {
    if (dy > 0) setDir("DOWN");
    else setDir("UP");
  }
});

function togglePause() {
  paused = !paused;
}

function restart() {
  init();
}

function collision(head, arr) {
  return arr.some(p => p.x === head.x && p.y === head.y);
}

function draw() {
  if (paused) return;

  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, 400, 400);

  // snake
  snake.forEach((p, i) => {
    ctx.fillStyle = i === 0 ? "#0f0" : "#0a0";
    ctx.fillRect(p.x, p.y, box, box);
  });

  // food
  ctx.fillStyle = "red";
  ctx.fillRect(food.x, food.y, box, box);

  let headX = snake[0].x;
  let headY = snake[0].y;

  if (direction === "LEFT") headX -= box;
  if (direction === "RIGHT") headX += box;
  if (direction === "UP") headY -= box;
  if (direction === "DOWN") headY += box;

  let newHead = { x: headX, y: headY };

  // game over
  if (
    headX < 0 || headY < 0 ||
    headX >= 400 || headY >= 400 ||
    collision(newHead, snake)
  ) {
    if (score > high) {
      high = score;
      localStorage.setItem("snakeHigh", high);
      document.getElementById("high").innerText = high;
    }
    init();
    return;
  }

  snake.unshift(newHead);

  if (headX === food.x && headY === food.y) {
    score++;
    document.getElementById("score").innerText = score;
    food = randomFood();

    // speed up every 3 points
    if (score % 3 === 0 && speed > 60) {
      speed -= 10;
      clearInterval(game);
      game = setInterval(draw, speed);
    }
  } else {
    snake.pop();
  }
}

init();
</script>

</body>
</html>
