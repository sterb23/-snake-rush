<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Snake Game - Joystick Edition</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  height: 100%;
  background: #111;
  font-family: Arial;
  color: white;
  touch-action: none;
  display: flex;
  flex-direction: column;
  align-items: center;
}

h2 { margin: 10px 0; }

canvas {
  background: black;
  border: 2px solid #0f0;
}

.hud {
  display: flex;
  gap: 20px;
  margin: 8px;
}

#joystick-area {
  margin-top: 15px;
  width: 140px;
  height: 140px;
  display: flex;
  justify-content: center;
  align-items: center;
}

#joystick-base {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  border: 2px solid #0f0;
  background: rgba(0,255,0,0.08);
  position: relative;
  touch-action: none;
}

#joystick-stick {
  width: 50px;
  height: 50px;
  background: #0f0;
  border-radius: 50%;
  position: absolute;
  top: 35px;
  left: 35px;
  transition: transform 0.05s linear;
}

button {
  margin: 5px;
  padding: 6px 10px;
  background: #0f0;
  border: none;
  font-weight: bold;
}
</style>
</head>

<body>

<h2>🐍 Snake Joystick Game</h2>

<div class="hud">
  <div>Score: <span id="score">0</span></div>
  <div>High: <span id="high">0</span></div>
</div>

<canvas id="game" width="400" height="400"></canvas>

<!-- JOYSTICK -->
<div id="joystick-area">
  <div id="joystick-base">
    <div id="joystick-stick"></div>
  </div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const box = 20;

let snake, food, direction, score, high, speed, game, paused;

high = localStorage.getItem("snakeHigh") || 0;
document.getElementById("high").innerText = high;

function init() {
  snake = [{ x: 9 * box, y: 9 * box }];
  direction = "RIGHT";
  score = 0;
  speed = 150;
  paused = false;

  food = randomFood();

  document.getElementById("score").innerText = score;

  clearInterval(game);
  game = setInterval(draw, speed);
}

function randomFood() {
  return {
    x: Math.floor(Math.random() * 20) * box,
    y: Math.floor(Math.random() * 20) * box
  };
}

function collision(head, arr) {
  return arr.some(p => p.x === head.x && p.y === head.y);
}

// ================= JOYSTICK =================
let joyBase = document.getElementById("joystick-base");
let joyStick = document.getElementById("joystick-stick");

let dragging = false;
let joyX = 0;
let joyY = 0;

const maxDist = 40;

function setStick(x, y) {
  joyStick.style.transform = `translate(${x}px, ${y}px)`;
}

joyBase.addEventListener("pointerdown", (e) => {
  dragging = true;
  joyBase.setPointerCapture(e.pointerId);
});

joyBase.addEventListener("pointerup", () => {
  dragging = false;
  startReset();
});

joyBase.addEventListener("pointercancel", () => {
  dragging = false;
  startReset();
});

joyBase.addEventListener("pointermove", (e) => {
  if (!dragging) return;

  let rect = joyBase.getBoundingClientRect();

  let x = e.clientX - rect.left - rect.width / 2;
  let y = e.clientY - rect.top - rect.height / 2;

  let dist = Math.sqrt(x*x + y*y);

  if (dist > maxDist) {
    x = (x / dist) * maxDist;
    y = (y / dist) * maxDist;
  }

  joyX = x / maxDist;
  joyY = y / maxDist;

  setStick(x, y);
});

// smooth retract
let resetAnim;
function startReset() {
  cancelAnimationFrame(resetAnim);

  function animate() {
    joyX *= 0.8;
    joyY *= 0.8;

    let x = joyX * maxDist;
    let y = joyY * maxDist;

    setStick(x, y);

    if (Math.abs(x) < 0.5 && Math.abs(y) < 0.5) {
      setStick(0, 0);
      joyX = 0;
      joyY = 0;
      return;
    }

    resetAnim = requestAnimationFrame(animate);
  }

  animate();
}

// convert joystick to direction
function updateDirectionFromJoystick() {
  if (Math.abs(joyX) > Math.abs(joyY)) {
    if (joyX > 0.5 && direction !== "LEFT") direction = "RIGHT";
    else if (joyX < -0.5 && direction !== "RIGHT") direction = "LEFT";
  } else {
    if (joyY > 0.5 && direction !== "UP") direction = "DOWN";
    else if (joyY < -0.5 && direction !== "DOWN") direction = "UP";
  }
}

// ================= GAME =================
function draw() {
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, 400, 400);

  updateDirectionFromJoystick();

  snake.forEach((p, i) => {
    ctx.fillStyle = i === 0 ? "#0f0" : "#0a0";
    ctx.fillRect(p.x, p.y, box, box);
  });

  ctx.fillStyle = "red";
  ctx.fillRect(food.x, food.y, box, box);

  let headX = snake[0].x;
  let headY = snake[0].y;

  if (direction === "LEFT") headX -= box;
  if (direction === "RIGHT") headX += box;
  if (direction === "UP") headY -= box;
  if (direction === "DOWN") headY += box;

  let newHead = { x: headX, y: headY };

  if (
    headX < 0 || headY < 0 ||
    headX >= 400 || headY >= 400 ||
    collision(newHead, snake)
  ) {
    if (score > high) {
      high = score;
      localStorage.setItem("snakeHigh", high);
      document.getElementById("high").innerText = high;
    }
    init();
    return;
  }

  snake.unshift(newHead);

  if (headX === food.x && headY === food.y) {
    score++;
    document.getElementById("score").innerText = score;
    food = randomFood();

    if (score % 3 === 0 && speed > 60) {
      speed -= 10;
      clearInterval(game);
      game = setInterval(draw, speed);
    }
  } else {
    snake.pop();
  }
}

// lock screen attempt
document.addEventListener("touchstart", () => {
  const el = document.documentElement;
  if (el.requestFullscreen) el.requestFullscreen();
}, { once: true });

init();
</script>

</body>
</html>
