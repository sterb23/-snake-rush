<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Basic Snake</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: black;
  touch-action: none;
  font-family: Arial;
}

canvas {
  display: block;
  margin: auto;
  background: #000;
  border: 1px solid #333;
}

#ui {
  position: absolute;
  top: 10px;
  left: 10px;
  color: white;
}
</style>
</head>

<body>

<div id="ui">Score: <span id="score">0</span></div>
<canvas id="game"></canvas>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const box = 20;

let cols, rows;

function resize() {
  canvas.width = Math.floor(window.innerWidth / box) * box;
  canvas.height = Math.floor(window.innerHeight / box) * box;

  cols = canvas.width / box;
  rows = canvas.height / box;
}
window.addEventListener("resize", resize);
resize();

let snake, food, dir, score = 0;
let loop;

/* INIT */
function init() {
  snake = [{
    x: Math.floor(cols / 2) * box,
    y: Math.floor(rows / 2) * box
  }];

  dir = "RIGHT";
  score = 0;
  food = spawnFood();
}

/* FOOD */
function spawnFood() {
  return {
    x: Math.floor(Math.random() * cols) * box,
    y: Math.floor(Math.random() * rows) * box
  };
}

/* CONTROLS */
document.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft") dir = "LEFT";
  if (e.key === "ArrowRight") dir = "RIGHT";
  if (e.key === "ArrowUp") dir = "UP";
  if (e.key === "ArrowDown") dir = "DOWN";
});

/* SWIPE */
let sx, sy;

document.addEventListener("touchstart", e => {
  sx = e.touches[0].clientX;
  sy = e.touches[0].clientY;
});

document.addEventListener("touchend", e => {
  let dx = e.changedTouches[0].clientX - sx;
  let dy = e.changedTouches[0].clientY - sy;

  if (Math.abs(dx) > Math.abs(dy)) {
    dir = dx > 0 ? "RIGHT" : "LEFT";
  } else {
    dir = dy > 0 ? "DOWN" : "UP";
  }
});

/* GAME LOOP */
function game() {

  ctx.fillStyle = "black";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  let head = { ...snake[0] };

  if (dir === "RIGHT") head.x += box;
  if (dir === "LEFT") head.x -= box;
  if (dir === "UP") head.y -= box;
  if (dir === "DOWN") head.y += box;

  /* WALL */
  if (
    head.x < 0 ||
    head.y < 0 ||
    head.x >= canvas.width ||
    head.y >= canvas.height
  ) return restart();

  /* SELF */
  for (let s of snake) {
    if (s.x === head.x && s.y === head.y) return restart();
  }

  snake.unshift(head);

  /* EAT */
  if (head.x === food.x && head.y === food.y) {
    score++;
    food = spawnFood();
  } else {
    snake.pop();
  }

  drawSnake();
  drawFood();

  document.getElementById("score").innerText = score;
}

/* DRAW SNAKE */
function drawSnake() {
  ctx.fillStyle = "lime";

  for (let s of snake) {
    ctx.fillRect(s.x, s.y, box, box);
  }
}

/* DRAW FOOD */
function drawFood() {
  ctx.fillStyle = "red";
  ctx.fillRect(food.x, food.y, box, box);
}

/* START */
function start() {
  init();
  clearInterval(loop);
  loop = setInterval(game, 120);
}

/* RESTART */
function restart() {
  start();
}

start();

</script>

</body>
</html>
