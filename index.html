<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Ultimate Polished</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  height: 100%;
  touch-action: none;
  background: radial-gradient(circle, #050505, #000);
  font-family: Arial;
  color: white;
}

/* CANVAS */
canvas {
  display: block;
  margin: auto;
  background: #000;
  border: 2px solid #00ffcc;
  box-shadow: 0 0 25px #00ffcc;
}

/* UI */
#ui {
  position: absolute;
  top: 10px;
  left: 10px;
  font-size: 14px;
}

/* START */
#startScreen {
  position: fixed;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.95);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 10;
}

/* JOYSTICK */
#joy {
  position: absolute;
  bottom: 30px;
  left: 30px;
  width: 110px;
  height: 110px;
  border-radius: 50%;
  border: 2px solid #00ffcc;
}

#stick {
  width: 40px;
  height: 40px;
  background: #00ffcc;
  border-radius: 50%;
  position: absolute;
  top: 35px;
  left: 35px;
}
</style>
</head>

<body>

<div id="startScreen">
  <h1>🐍 Snake Ultimate Polished</h1>
  <button onclick="startGame()">Play</button>
</div>

<div id="ui">
Score: <span id="score">0</span><br>
High: <span id="high">0</span><br>
Skin: <span id="skin">Neon</span>
</div>

<canvas id="game" width="420" height="420"></canvas>

<div id="joy"><div id="stick"></div></div>

<audio id="eat" src="https://actions.google.com/sounds/v1/cartoon/pop.ogg"></audio>
<audio id="die" src="https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg"></audio>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const box = 20;

let snake, dir, food, particles;
let score = 0;
let high = localStorage.getItem("snakeHigh") || 0;

let skins = ["#00ffcc","#ff4444","#ffcc00","#aa66ff"];
let skinIndex = 0;

let speed = 140;
let loop;

let shake = 0;

document.getElementById("high").innerText = high;

/* INIT */
function init(){
  snake=[{x:10*box,y:10*box}];
  dir="RIGHT";
  food=spawnFood();
  particles=[];
  score=0;
  shake=0;
  updateUI();
}

/* FOOD */
function spawnFood(){
  return {
    x:Math.floor(Math.random()*21)*box,
    y:Math.floor(Math.random()*21)*box
  };
}

/* CONTROLS */
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft") dir="LEFT";
  if(e.key==="ArrowRight") dir="RIGHT";
  if(e.key==="ArrowUp") dir="UP";
  if(e.key==="ArrowDown") dir="DOWN";
});

/* JOYSTICK */
let joy=document.getElementById("joy");
let stick=document.getElementById("stick");

joy.addEventListener("touchmove",e=>{
  let t=e.touches[0];
  let r=joy.getBoundingClientRect();

  let x=t.clientX-r.left-55;
  let y=t.clientY-r.top-55;

  stick.style.transform=`translate(${x}px,${y}px)`;

  if(Math.abs(x)>Math.abs(y)){
    dir=x>0?"RIGHT":"LEFT";
  } else {
    dir=y>0?"DOWN":"UP";
  }
});

/* PARTICLES */
function burst(x,y,color){
  for(let i=0;i<10;i++){
    particles.push({
      x,y,
      dx:(Math.random()-0.5)*4,
      dy:(Math.random()-0.5)*4,
      life:20,
      color
    });
  }
}

/* GAME */
function game(){

  ctx.save();
  if(shake>0){
    let sx=(Math.random()-0.5)*shake;
    let sy=(Math.random()-0.5)*shake;
    ctx.translate(sx,sy);
    shake*=0.9;
  }

  ctx.fillStyle="rgba(0,0,0,0.35)";
  ctx.fillRect(0,0,420,420);

  let head={...snake[0]};

  if(dir==="RIGHT") head.x+=box;
  if(dir==="LEFT") head.x-=box;
  if(dir==="UP") head.y-=box;
  if(dir==="DOWN") head.y+=box;

  if(head.x<0||head.y<0||head.x>=420||head.y>=420) return die();

  for(let s of snake){
    if(s.x===head.x&&s.y===head.y) return die();
  }

  snake.unshift(head);

  if(head.x===food.x&&head.y===food.y){
    score++;
    document.getElementById("eat").play();

    burst(food.x+10,food.y+10,"#ff5555");
    food=spawnFood();

    if(score%5===0){
      skinIndex=(skinIndex+1)%skins.length;
      document.getElementById("skin").innerText="Skin "+(skinIndex+1);
    }

    if(score%3===0 && speed>70){
      speed-=10;
      clearInterval(loop);
      loop=setInterval(game,speed);
    }

  } else {
    snake.pop();
  }

  drawFood();
  drawSnake();
  drawParticles();

  updateUI();

  ctx.restore();
}

/* DRAW SNAKE */
function drawSnake(){
  ctx.lineWidth=14;
  ctx.lineCap="round";
  ctx.strokeStyle=skins[skinIndex];
  ctx.shadowBlur=20;
  ctx.shadowColor=skins[skinIndex];

  ctx.beginPath();
  for(let i=0;i<snake.length;i++){
    let s=snake[i];
    if(i===0) ctx.moveTo(s.x+10,s.y+10);
    else ctx.lineTo(s.x+10,s.y+10);
  }
  ctx.stroke();
  ctx.shadowBlur=0;
}

/* FOOD */
function drawFood(){
  ctx.fillStyle="#ff4444";
  ctx.beginPath();
  ctx.arc(food.x+10,food.y+10,10,0,Math.PI*2);
  ctx.fill();
}

/* PARTICLES */
function drawParticles(){
  particles.forEach((p,i)=>{
    p.x+=p.dx;
    p.y+=p.dy;
    p.life--;

    ctx.fillStyle=p.color;
    ctx.fillRect(p.x,p.y,3,3);

    if(p.life<=0) particles.splice(i,1);
  });
}

/* UI */
function updateUI(){
  document.getElementById("score").innerText=score;

  if(score>high){
    high=score;
    localStorage.setItem("snakeHigh",high);
    document.getElementById("high").innerText=high;
  }
}

/* START */
function startGame(){
  document.getElementById("startScreen").style.display="none";
  init();
  loop=setInterval(game,speed);
}

/* DIE */
function die(){
  shake=15;
  document.getElementById("die").play();
  clearInterval(loop);
  alert("Game Over! Score: "+score);
  document.getElementById("startScreen").style.display="flex";
}
</script>

</body>
</html>
