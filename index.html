<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Surge: Evolution</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #050510; font-family: 'Segoe UI', sans-serif; user-select: none; touch-action: none; }
        canvas { display: block; width: 100vw; height: 100vh; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; color: #fff; }
        
        /* Utility */
        .panel { background: rgba(10, 10, 25, 0.95); padding: 20px; width: 90%; max-width: 400px; border-radius: 15px; border: 2px solid #0ff; pointer-events: auto; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; }
        .hidden { display: none !important; }
        button { background: transparent; border: 2px solid #0ff; color: #0ff; padding: 10px; margin: 5px; cursor: pointer; text-transform: uppercase; border-radius: 5px; }
        
        /* Settings Sliders */
        .slider-group { margin: 15px 0; text-align: left; }
        input[type=range] { width: 100%; accent-color: #0ff; }
        
        /* Controls */
        #mobile-controls { position: absolute; bottom: 30px; left: 0; width: 100%; height: 150px; pointer-events: none; }
        #joystick-zone { position: absolute; bottom: 0; left: 30px; width: 120px; height: 120px; background: rgba(255, 255, 255, 0.05); border: 2px dashed #0ff; border-radius: 50%; pointer-events: auto; display: none; }
    </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<!-- Controls -->
<div id="mobile-controls">
    <div id="joystick-zone"><div id="joystick-stick" style="width:50px;height:50px;background:#0ff;border-radius:50%;position:absolute;top:35px;left:35px;"></div></div>
</div>

<div id="ui-layer">
    <div id="menu-panel" class="panel">
        <h1>NEON SURGE</h1>
        <button id="start-btn">Start Game</button>
        <button id="settings-btn">Settings</button>
    </div>

    <div id="settings-panel" class="panel hidden">
        <h2>Settings</h2>
        <div class="slider-group">
            <label>Music Volume</label>
            <input type="range" id="music-vol" min="0" max="1" step="0.1" value="0.5">
        </div>
        <div class="slider-group">
            <label>SFX Volume</label>
            <input type="range" id="sfx-vol" min="0" max="1" step="0.1" value="0.5">
        </div>
        <div class="slider-group">
            <label>VFX Density</label>
            <input type="range" id="vfx-density" min="0.1" max="1" step="0.1" value="1">
        </div>
        <h3>Control Mode</h3>
        <button id="ctrl-touch">Touch Drag</button>
        <button id="ctrl-joy">Joystick</button>
        <button id="close-settings">Back</button>
    </div>
</div>

<script>
    // --- Audio Engine ---
    const AudioEngine = {
        ctx: new (window.AudioContext || window.webkitAudioContext)(),
        masterGain: null,
        sfxGain: null,
        musicGain: null,
        
        init() {
            this.masterGain = this.ctx.createGain();
            this.sfxGain = this.ctx.createGain();
            this.musicGain = this.ctx.createGain();
            this.masterGain.connect(this.ctx.destination);
            this.sfxGain.connect(this.masterGain);
            this.musicGain.connect(this.masterGain);
        },

        playTone(freq, type, duration, gainNode) {
            if (this.ctx.state === 'suspended') this.ctx.resume();
            const osc = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
            g.gain.setValueAtTime(0.1, this.ctx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
            osc.connect(g);
            g.connect(gainNode);
            osc.start(); osc.stop(this.ctx.currentTime + duration);
        },

        playShoot() { this.playTone(440, 'square', 0.1, this.sfxGain); },
        playExplosion() { this.playTone(100, 'sawtooth', 0.3, this.sfxGain); }
    };

    // --- State & Config ---
    let gameState = { ctrlMode: 'touch', musicVol: 0.5, sfxVol: 0.5, vfxDensity: 1 };
    
    // --- UI Logic ---
    document.getElementById('settings-btn').addEventListener('click', () => {
        document.getElementById('menu-panel').classList.add('hidden');
        document.getElementById('settings-panel').classList.remove('hidden');
    });

    document.getElementById('close-settings').addEventListener('click', () => {
        document.getElementById('menu-panel').classList.remove('hidden');
        document.getElementById('settings-panel').classList.add('hidden');
    });

    // Handle Joystick Visibility
    function updateControls() {
        const joy = document.getElementById('joystick-zone');
        joy.style.display = (gameState.ctrlMode === 'joy') ? 'block' : 'none';
    }

    document.getElementById('ctrl-joy').addEventListener('click', () => { gameState.ctrlMode = 'joy'; updateControls(); });
    document.getElementById('ctrl-touch').addEventListener('click', () => { gameState.ctrlMode = 'touch'; updateControls(); });

    // Slider Listeners
    document.getElementById('music-vol').addEventListener('input', (e) => { 
        gameState.musicVol = e.target.value; 
        if(AudioEngine.musicGain) AudioEngine.musicGain.gain.value = gameState.musicVol;
    });
    document.getElementById('sfx-vol').addEventListener('input', (e) => { 
        gameState.sfxVol = e.target.value;
        if(AudioEngine.sfxGain) AudioEngine.sfxGain.gain.value = gameState.sfxVol;
    });

    // --- Initialization ---
    document.getElementById('start-btn').addEventListener('click', () => {
        AudioEngine.init();
        AudioEngine.musicGain.gain.value = gameState.musicVol;
        AudioEngine.sfxGain.gain.value = gameState.sfxVol;
        document.getElementById('menu-panel').classList.add('hidden');
        
        // Start game loop (omitted for brevity)
        console.log("Game Started");
    });
</script>
</body>
</html>
