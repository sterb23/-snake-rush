<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Neon Snake v1</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: #000;
  touch-action: none;
  font-family: Arial;
}

canvas {
  display: block;
  margin: auto;
  background: #000;
}

/* UI */
#ui {
  position: absolute;
  top: 10px;
  left: 10px;
  color: #00ffcc;
  font-size: 14px;
  z-index: 2;
}

/* START SCREEN */
#start {
  position: fixed;
  width: 100%;
  height: 100%;
  background: #000;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  color: white;
  z-index: 10;
}

button {
  padding: 12px 18px;
  border: none;
  border-radius: 8px;
  background: #00ffcc;
  font-weight: bold;
}
</style>
</head>

<body>

<div id="start">
  <h1>🐍 Neon Snake v1</h1>
  <button onclick="startGame()">Start</button>
</div>

<div id="ui">
Score: <span id="score">0</span>
</div>

<canvas id="game"></canvas>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const box = 20;

let cols, rows;
let snake, food, dir;
let score = 0;
let loop;
let speed = 140;

/* RESIZE CANVAS TO SCREEN */
function resize() {
  canvas.width = Math.floor(window.innerWidth / box) * box;
  canvas.height = Math.floor(window.innerHeight / box) * box;

  cols = canvas.width / box;
  rows = canvas.height / box;
}
window.addEventListener("resize", resize);
resize();

/* INIT GAME */
function init() {
  snake = [{
    x: Math.floor(cols / 2) * box,
    y: Math.floor(rows / 2) * box
  }];

  dir = "RIGHT";
  score = 0;
  speed = 140;
  food = spawnFood();

  updateUI();
}

/* SAFE FOOD SPAWN */
function spawnFood() {
  return {
    x: Math.floor(Math.random() * cols) * box,
    y: Math.floor(Math.random() * rows) * box
  };
}

/* CONTROLS */
document.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft") dir = "LEFT";
  if (e.key === "ArrowRight") dir = "RIGHT";
  if (e.key === "ArrowUp") dir = "UP";
  if (e.key === "ArrowDown") dir = "DOWN";
});

/* SWIPE */
let sx, sy;

document.addEventListener("touchstart", e => {
  sx = e.touches[0].clientX;
  sy = e.touches[0].clientY;
});

document.addEventListener("touchend", e => {
  let dx = e.changedTouches[0].clientX - sx;
  let dy = e.changedTouches[0].clientY - sy;

  if (Math.abs(dx) > Math.abs(dy)) {
    dir = dx > 0 ? "RIGHT" : "LEFT";
  } else {
    dir = dy > 0 ? "DOWN" : "UP";
  }
});

/* GAME LOOP */
function game() {

  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  drawGrid();

  let head = { ...snake[0] };

  if (dir === "RIGHT") head.x += box;
  if (dir === "LEFT") head.x -= box;
  if (dir === "UP") head.y -= box;
  if (dir === "DOWN") head.y += box;

  /* WALL COLLISION */
  if (head.x < 0 || head.y < 0 || head.x >= canvas.width || head.y >= canvas.height)
    return die();

  /* SELF COLLISION */
  for (let s of snake) {
    if (s.x === head.x && s.y === head.y) return die();
  }

  snake.unshift(head);

  /* EAT FOOD */
  if (head.x === food.x && head.y === food.y) {
    score++;
    food = spawnFood();

    if (score % 3 === 0 && speed > 60) {
      speed -= 15;
      clearInterval(loop);
      loop = setInterval(game, speed);
    }

  } else {
    snake.pop();
  }

  drawFood();
  drawSnake();

  updateUI();
}

/* GRID */
function drawGrid() {
  ctx.strokeStyle = "rgba(0,255,204,0.12)";

  for (let i = 0; i <= canvas.width; i += box) {
    ctx.beginPath();
    ctx.moveTo(i, 0);
    ctx.lineTo(i, canvas.height);
    ctx.stroke();
  }

  for (let i = 0; i <= canvas.height; i += box) {
    ctx.beginPath();
    ctx.moveTo(0, i);
    ctx.lineTo(canvas.width, i);
    ctx.stroke();
  }
}

/* SNAKE (MARKER STYLE) */
function drawSnake() {
  ctx.lineWidth = 14;
  ctx.lineCap = "round";
  ctx.strokeStyle = "#00ffcc";
  ctx.shadowBlur = 12;
  ctx.shadowColor = "#00ffcc";

  ctx.beginPath();

  for (let i = 0; i < snake.length; i++) {
    let s = snake[i];
    if (i === 0) ctx.moveTo(s.x + box/2, s.y + box/2);
    else ctx.lineTo(s.x + box/2, s.y + box/2);
  }

  ctx.stroke();
  ctx.shadowBlur = 0;
}

/* FOOD */
function drawFood() {
  ctx.fillStyle = "#ff4444";
  ctx.beginPath();
  ctx.arc(food.x + box/2, food.y + box/2, 8, 0, Math.PI * 2);
  ctx.fill();
}

/* UI */
function updateUI() {
  document.getElementById("score").innerText = score;
}

/* START */
function startGame() {
  document.getElementById("start").style.display = "none";
  init();
  clearInterval(loop);
  loop = setInterval(game, speed);
}

/* GAME OVER */
function die() {
  clearInterval(loop);
  alert("Game Over! Score: " + score);
  document.getElementById("start").style.display = "flex";
}

</script>

</body>
</html>
