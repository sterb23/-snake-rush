<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Arcade Pro</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  height: 100%;
  touch-action: none;
  background: #050505;
  font-family: Arial;
  color: white;
}

/* START SCREEN */
#startScreen {
  position: fixed;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle, #111, #000);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 10;
}

button {
  padding: 12px 25px;
  background: #00ff99;
  border: none;
  border-radius: 10px;
  color: black;
  font-weight: bold;
  cursor: pointer;
}

/* UI */
#ui {
  position: absolute;
  top: 10px;
  left: 10px;
  font-size: 14px;
}

/* CANVAS CENTER */
canvas {
  display: block;
  margin: auto;
  background: #000;
  border: 2px solid #00ff99;
  box-shadow: 0 0 25px #00ff99;
}
</style>
</head>

<body>

<div id="startScreen">
  <h1>🐍 Snake Arcade Pro</h1>
  <button onclick="startGame()">Play</button>
</div>

<div id="ui">
  Score: <span id="score">0</span><br>
  High Score: <span id="high">0</span>
</div>

<canvas id="game" width="420" height="420"></canvas>

<audio id="eat" src="https://actions.google.com/sounds/v1/cartoon/pop.ogg"></audio>
<audio id="die" src="https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg"></audio>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const box = 20;

let snake, dir, food, particles, score, high, loop;

high = localStorage.getItem("snakeHigh") || 0;
document.getElementById("high").innerText = high;

function init() {
  snake = [{x: 10*box, y: 10*box}];
  dir = "RIGHT";
  food = spawnFood();
  particles = [];
  score = 0;
  updateUI();
}

function spawnFood() {
  return {
    x: Math.floor(Math.random()*21)*box,
    y: Math.floor(Math.random()*21)*box
  };
}

/* CONTROLS */
document.addEventListener("keydown", e => {
  if (e.key==="ArrowLeft" && dir!=="RIGHT") dir="LEFT";
  if (e.key==="ArrowRight" && dir!=="LEFT") dir="RIGHT";
  if (e.key==="ArrowUp" && dir!=="DOWN") dir="UP";
  if (e.key==="ArrowDown" && dir!=="UP") dir="DOWN";
});

/* SWIPE */
let sx, sy;
document.addEventListener("touchstart", e=>{
  sx=e.touches[0].clientX;
  sy=e.touches[0].clientY;
});

document.addEventListener("touchend", e=>{
  let dx=e.changedTouches[0].clientX-sx;
  let dy=e.changedTouches[0].clientY-sy;

  if(Math.abs(dx)>Math.abs(dy)){
    if(dx>0 && dir!=="LEFT") dir="RIGHT";
    else if(dx<0 && dir!=="RIGHT") dir="LEFT";
  } else {
    if(dy>0 && dir!=="UP") dir="DOWN";
    else if(dy<0 && dir!=="DOWN") dir="UP";
  }
});

/* PARTICLES */
function addParticles(x,y){
  for(let i=0;i<8;i++){
    particles.push({
      x,y,
      dx:(Math.random()-0.5)*4,
      dy:(Math.random()-0.5)*4,
      life:20
    });
  }
}

/* DRAW GRID */
function drawGrid(){
  ctx.strokeStyle="#111";
  for(let i=0;i<420;i+=box){
    ctx.beginPath();
    ctx.moveTo(i,0);
    ctx.lineTo(i,420);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(0,i);
    ctx.lineTo(420,i);
    ctx.stroke();
  }
}

/* GAME LOOP */
function game(){
  ctx.fillStyle="#000";
  ctx.fillRect(0,0,420,420);

  drawGrid();

  /* MOVE HEAD */
  let head={...snake[0]};

  if(dir==="RIGHT") head.x+=box;
  if(dir==="LEFT") head.x-=box;
  if(dir==="UP") head.y-=box;
  if(dir==="DOWN") head.y+=box;

  /* COLLISION */
  if(head.x<0||head.y<0||head.x>=420||head.y>=420) return die();

  for(let i=0;i<snake.length;i++){
    if(head.x===snake[i].x && head.y===snake[i].y) return die();
  }

  snake.unshift(head);

  /* FOOD */
  if(head.x===food.x && head.y===food.y){
    score++;
    document.getElementById("eat").play();
    food=spawnFood();
    addParticles(head.x,head.y);
  } else {
    snake.pop();
  }

  /* DRAW FOOD (GLOW APPLE) */
  let gradient = ctx.createRadialGradient(
    food.x+10, food.y+10, 2,
    food.x+10, food.y+10, 15
  );
  gradient.addColorStop(0,"#ff5555");
  gradient.addColorStop(1,"#aa0000");

  ctx.fillStyle=gradient;
  ctx.fillRect(food.x,food.y,box,box);

  /* DRAW SNAKE (SMOOTH STYLE) */
  for(let i=0;i<snake.length;i++){
    let s=snake[i];
    ctx.fillStyle=i===0?"#00ffcc":"#00aa88";
    ctx.shadowBlur=10;
    ctx.shadowColor="#00ffcc";
    ctx.fillRect(s.x,s.y,box,box);
  }
  ctx.shadowBlur=0;

  /* PARTICLES */
  particles.forEach((p,i)=>{
    p.x+=p.dx;
    p.y+=p.dy;
    p.life--;

    ctx.fillStyle="yellow";
    ctx.fillRect(p.x,p.y,3,3);

    if(p.life<=0) particles.splice(i,1);
  });

  updateUI();
}

/* SPEED CONTROL */
let speed=120;

function startLoop(){
  clearInterval(loop);
  loop=setInterval(game,speed);
}

function startGame(){
  document.getElementById("startScreen").style.display="none";
  init();
  startLoop();
}

function updateUI(){
  document.getElementById("score").innerText=score;

  if(score>high){
    high=score;
    localStorage.setItem("snakeHigh",high);
  }

  document.getElementById("high").innerText=high;

  /* SPEED UP */
  if(score%5===0 && speed>60){
    speed-=5;
    startLoop();
  }
}

function die(){
  clearInterval(loop);
  document.getElementById("die").play();

  alert("Game Over! Score: "+score);
  document.getElementById("startScreen").style.display="flex";
}
</script>

</body>
</html>
