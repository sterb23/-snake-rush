<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Snake Fixed</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: black;
  touch-action: none;
}

canvas {
  display: block;
  margin: auto;
  background: #000;
  border: 2px solid #00ffcc;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const box = 20;

let cols, rows;
let snake = [];
let food = {};
let dir = "RIGHT";
let loop;

/* 🔥 ALWAYS VALID CANVAS */
function resize() {
  canvas.width = Math.floor(window.innerWidth / box) * box;
  canvas.height = Math.floor(window.innerHeight / box) * box;

  cols = canvas.width / box;
  rows = canvas.height / box;
}

window.addEventListener("resize", resize);
resize();

/* 🔥 SAFE INIT */
function init() {
  const cx = Math.floor(cols / 2) * box;
  const cy = Math.floor(rows / 2) * box;

  snake = [{ x: cx, y: cy }];
  dir = "RIGHT";

  spawnFood();
}

/* FOOD */
function spawnFood() {
  food = {
    x: Math.floor(Math.random() * cols) * box,
    y: Math.floor(Math.random() * rows) * box
  };
}

/* CONTROLS */
document.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft") dir = "LEFT";
  if (e.key === "ArrowRight") dir = "RIGHT";
  if (e.key === "ArrowUp") dir = "UP";
  if (e.key === "ArrowDown") dir = "DOWN";
});

/* GAME */
function game() {

  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  let head = { ...snake[0] };

  if (dir === "RIGHT") head.x += box;
  if (dir === "LEFT") head.x -= box;
  if (dir === "UP") head.y -= box;
  if (dir === "DOWN") head.y += box;

  /* WALL */
  if (
    head.x < 0 ||
    head.y < 0 ||
    head.x >= canvas.width ||
    head.y >= canvas.height
  ) return restart();

  /* SELF */
  for (let s of snake) {
    if (s.x === head.x && s.y === head.y) return restart();
  }

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    spawnFood();
  } else {
    snake.pop();
  }

  drawGrid();
  drawFood();
  drawSnake();
}

/* GRID */
function drawGrid() {
  ctx.strokeStyle = "rgba(0,255,204,0.15)";

  for (let i = 0; i <= canvas.width; i += box) {
    ctx.beginPath();
    ctx.moveTo(i, 0);
    ctx.lineTo(i, canvas.height);
    ctx.stroke();
  }

  for (let i = 0; i <= canvas.height; i += box) {
    ctx.beginPath();
    ctx.moveTo(0, i);
    ctx.lineTo(canvas.width, i);
    ctx.stroke();
  }
}

/* SNAKE */
function drawSnake() {
  ctx.lineWidth = 14;
  ctx.lineCap = "round";
  ctx.strokeStyle = "#00ffcc";
  ctx.shadowBlur = 15;
  ctx.shadowColor = "#00ffcc";

  ctx.beginPath();

  for (let i = 0; i < snake.length; i++) {
    let s = snake[i];

    if (i === 0) {
      ctx.moveTo(s.x + box / 2, s.y + box / 2);
    } else {
      ctx.lineTo(s.x + box / 2, s.y + box / 2);
    }
  }

  ctx.stroke();
  ctx.shadowBlur = 0;
}

/* FOOD */
function drawFood() {
  ctx.fillStyle = "red";
  ctx.beginPath();
  ctx.arc(food.x + box / 2, food.y + box / 2, 8, 0, Math.PI * 2);
  ctx.fill();
}

/* START SAFE */
function start() {
  resize();   // MUST be first
  init();     // MUST be after resize

  clearInterval(loop);
  loop = setInterval(game, 120);
}

/* RESTART */
function restart() {
  clearInterval(loop);
  start();
}

/* BOOT GAME */
start();

</script>

</body>
</html>
