<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Surge</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #050510;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        canvas {
            display: block;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
        }

        #score-display {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 0 10px #0ff, 0 0 20px #0ff;
            display: none;
        }

        .panel {
            background: rgba(10, 10, 25, 0.85);
            padding: 40px;
            border-radius: 15px;
            border: 2px solid #0ff;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5), inset 0 0 20px rgba(0, 255, 255, 0.2);
            text-align: center;
            pointer-events: auto;
            transition: opacity 0.3s ease;
        }

        h1 {
            margin-top: 0;
            font-size: 48px;
            text-transform: uppercase;
            letter-spacing: 5px;
            color: #fff;
            text-shadow: 0 0 10px #f0f, 0 0 20px #f0f, 0 0 40px #f0f;
        }

        .tutorial-text {
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 30px;
            color: #e0e0ff;
        }

        .key {
            display: inline-block;
            background: #222;
            padding: 5px 10px;
            border-radius: 5px;
            border: 1px solid #555;
            color: #0ff;
            font-weight: bold;
            box-shadow: 0 4px 0 #111;
            margin: 0 5px;
        }

        button {
            background: transparent;
            color: #0ff;
            border: 2px solid #0ff;
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
            transition: all 0.2s;
        }

        button:hover {
            background: #0ff;
            color: #000;
            box-shadow: 0 0 20px #0ff, 0 0 40px #0ff;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <div id="score-display">SCORE: <span id="score">0</span></div>

        <!-- Start / Tutorial Screen -->
        <div id="start-screen" class="panel">
            <h1>Neon Surge</h1>
            <div class="tutorial-text">
                <p><strong>HOW TO PLAY:</strong></p>
                <p>Move Mouse to steer your ship.</p>
                <p>Hold <span class="key">Left Click</span> or <span class="key">Spacebar</span> to shoot.</p>
                <p>Destroy the glowing shapes. Don't let them touch you!</p>
            </div>
            <button id="start-btn">Initialize</button>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="panel hidden">
            <h1 style="text-shadow: 0 0 10px #f00, 0 0 20px #f00, 0 0 40px #f00;">SYSTEM FAILURE</h1>
            <div class="tutorial-text">
                <p>Final Score: <strong id="final-score" style="color: #0ff; font-size: 24px;">0</strong></p>
            </div>
            <button id="restart-btn">Reboot System</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // UI Elements
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const scoreDisplay = document.getElementById('score-display');
        const scoreElement = document.getElementById('score');
        const finalScoreElement = document.getElementById('final-score');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');

        // Game State
        let gameActive = false;
        let score = 0;
        let animationId;
        let spawnInterval;

        // Entities
        let player;
        let projectiles = [];
        let enemies = [];
        let particles = [];
        let stars = [];

        // Input
        const mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
        let isShooting = false;
        let lastShotTime = 0;
        const fireRate = 100; // ms between shots

        // Resize Canvas
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Event Listeners
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        window.addEventListener('mousedown', () => isShooting = true);
        window.addEventListener('mouseup', () => isShooting = false);
        window.addEventListener('keydown', (e) => { if(e.code === 'Space') isShooting = true; });
        window.addEventListener('keyup', (e) => { if(e.code === 'Space') isShooting = false; });

        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);

        // Classes
        class Player {
            constructor() {
                this.x = canvas.width / 2;
                this.y = canvas.height / 2;
                this.radius = 15;
                this.color = '#0ff';
                this.velocity = { x: 0, y: 0 };
                this.friction = 0.85;
            }

            draw() {
                ctx.save();
                ctx.shadowBlur = 20;
                ctx.shadowColor = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2, false);
                ctx.fillStyle = '#fff';
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = this.color;
                ctx.stroke();

                // Draw ship core
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius / 2, 0, Math.PI * 2, false);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.restore();
            }

            update() {
                // Smooth follow mouse
                const dx = mouse.x - this.x;
                const dy = mouse.y - this.y;
                this.velocity.x += dx * 0.05;
                this.velocity.y += dy * 0.05;

                this.velocity.x *= this.friction;
                this.velocity.y *= this.friction;

                this.x += this.velocity.x;
                this.y += this.velocity.y;

                // Keep in bounds
                this.x = Math.max(this.radius, Math.min(canvas.width - this.radius, this.x));
                this.y = Math.max(this.radius, Math.min(canvas.height - this.radius, this.y));

                this.draw();
            }
        }

        class Projectile {
            constructor(x, y, velocity) {
                this.x = x;
                this.y = y;
                this.velocity = velocity;
                this.radius = 4;
                this.color = '#ff0';
            }

            draw() {
                ctx.save();
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2, false);
                ctx.fillStyle = '#fff';
                ctx.fill();
                ctx.restore();
            }

            update() {
                this.x += this.velocity.x;
                this.y += this.velocity.y;
                this.draw();
            }
        }

        class Enemy {
            constructor(x, y, radius, color, velocity) {
                this.x = x;
                this.y = y;
                this.radius = radius;
                this.color = color;
                this.velocity = velocity;
                this.edges = Math.floor(Math.random() * 4) + 3; // Triangles, squares, pentagons, hexagons
                this.angle = 0;
                this.spin = (Math.random() - 0.5) * 0.1;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                ctx.shadowBlur = 20;
                ctx.shadowColor = this.color;
                
                ctx.beginPath();
                for (let i = 0; i < this.edges; i++) {
                    const a = (Math.PI * 2 * i) / this.edges;
                    const px = Math.cos(a) * this.radius;
                    const py = Math.sin(a) * this.radius;
                    if (i === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.closePath();
                ctx.lineWidth = 3;
                ctx.strokeStyle = this.color;
                ctx.stroke();
                
                // Inner glow
                ctx.fillStyle = this.color.replace(')', ', 0.2)').replace('rgb', 'rgba');
                ctx.fill();
                ctx.restore();
            }

            update() {
                this.x += this.velocity.x;
                this.y += this.velocity.y;
                this.angle += this.spin;
                this.draw();
            }
        }

        class Particle {
            constructor(x, y, velocity, radius, color) {
                this.x = x;
                this.y = y;
                this.velocity = velocity;
                this.radius = radius;
                this.color = color;
                this.alpha = 1;
                this.friction = 0.98;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2, false);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.restore();
            }

            update() {
                this.velocity.x *= this.friction;
                this.velocity.y *= this.friction;
                this.x += this.velocity.x;
                this.y += this.velocity.y;
                this.alpha -= 0.015;
                this.draw();
            }
        }

        class Star {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.radius = Math.random() * 1.5;
                this.alpha = Math.random();
                this.speed = Math.random() * 0.5 + 0.1;
            }
            draw() {
                ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
            }
            update() {
                this.y += this.speed;
                if (this.y > canvas.height) {
                    this.y = 0;
                    this.x = Math.random() * canvas.width;
                }
                this.draw();
            }
        }

        // Functions
        function initStars() {
            stars = [];
            for(let i=0; i<100; i++) {
                stars.push(new Star());
            }
        }

        function spawnEnemies() {
            spawnInterval = setInterval(() => {
                const radius = Math.random() * 20 + 15;
                let x, y;

                if (Math.random() < 0.5) {
                    x = Math.random() < 0.5 ? 0 - radius : canvas.width + radius;
                    y = Math.random() * canvas.height;
                } else {
                    x = Math.random() * canvas.width;
                    y = Math.random() < 0.5 ? 0 - radius : canvas.height + radius;
                }

                const colors = ['#f0f', '#0f0', '#f00', '#ff8800'];
                const color = colors[Math.floor(Math.random() * colors.length)];
                
                const angle = Math.atan2(canvas.height / 2 - y, canvas.width / 2 - x);
                
                // Increase difficulty based on score
                const speedMult = 1 + (score * 0.002);
                const velocity = {
                    x: Math.cos(angle) * (Math.random() * 1.5 + 0.5) * speedMult,
                    y: Math.sin(angle) * (Math.random() * 1.5 + 0.5) * speedMult
                };

                enemies.push(new Enemy(x, y, radius, color, velocity));
            }, 1000);
        }

        function createExplosion(x, y, color) {
            for (let i = 0; i < 15; i++) {
                const velocity = {
                    x: (Math.random() - 0.5) * (Math.random() * 6),
                    y: (Math.random() - 0.5) * (Math.random() * 6)
                };
                particles.push(new Particle(x, y, velocity, Math.random() * 3 + 1, color));
            }
        }

        function startGame() {
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            scoreDisplay.style.display = 'block';
            
            player = new Player();
            projectiles = [];
            enemies = [];
            particles = [];
            score = 0;
            scoreElement.innerText = score;
            gameActive = true;
            isShooting = false;
            
            initStars();
            spawnEnemies();
            animate();
        }

        function gameOver() {
            gameActive = false;
            cancelAnimationFrame(animationId);
            clearInterval(spawnInterval);
            
            // Death explosion
            createExplosion(player.x, player.y, player.color);
            createExplosion(player.x, player.y, '#fff');

            // Draw one last frame to show player exploding
            ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => p.update());

            setTimeout(() => {
                gameOverScreen.classList.remove('hidden');
                finalScoreElement.innerText = score;
                scoreDisplay.style.display = 'none';
            }, 1000);
        }

        function handleShooting() {
            const currentTime = Date.now();
            if (isShooting && currentTime - lastShotTime > fireRate) {
                // Shoot straight up relative to screen
                const velocity = { x: 0, y: -15 };
                projectiles.push(new Projectile(player.x, player.y - player.radius, velocity));
                
                // Add slight recoil effect
                player.y += 2;
                lastShotTime = currentTime;
            }
        }

        function animate() {
            if (!gameActive) return;
            animationId = requestAnimationFrame(animate);

            // Trails effect
            ctx.fillStyle = 'rgba(5, 5, 16, 0.3)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Background
            stars.forEach(star => star.update());

            player.update();
            handleShooting();

            // Render Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                } else {
                    p.update();
                }
            }

            // Render Projectiles
            for (let i = projectiles.length - 1; i >= 0; i--) {
                const proj = projectiles[i];
                proj.update();

                // Remove off-screen
                if (proj.x < 0 || proj.x > canvas.width || proj.y < 0 || proj.y > canvas.height) {
                    projectiles.splice(i, 1);
                }
            }

            // Render Enemies & Collision Detection
            for (let i = enemies.length - 1; i >= 0; i--) {
                const enemy = enemies[i];
                enemy.update();

                // Enemy vs Player collision
                const distPlayer = Math.hypot(player.x - enemy.x, player.y - enemy.y);
                if (distPlayer - enemy.radius - player.radius < 0) {
                    gameOver();
                    return; // Stop processing to prevent errors
                }

                // Enemy vs Projectile collision
                for (let j = projectiles.length - 1; j >= 0; j--) {
                    const proj = projectiles[j];
                    const distProj = Math.hypot(proj.x - enemy.x, proj.y - enemy.y);

                    if (distProj - enemy.radius - proj.radius < 0) {
                        createExplosion(enemy.x, enemy.y, enemy.color);
                        score += 10;
                        scoreElement.innerText = score;
                        
                        enemies.splice(i, 1);
                        projectiles.splice(j, 1);
                        break; // Move to next enemy
                    }
                }
            }
        }

        // Draw initial static background
        initStars();
        ctx.fillStyle = '#050510';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        stars.forEach(star => star.draw());

    </script>
</body>
</html>
