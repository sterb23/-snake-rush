<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Round Snake Pro</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  height: 100%;
  touch-action: none;
  background: #050505;
  font-family: Arial;
  color: white;
}

canvas {
  display: block;
  margin: auto;
  background: #000;
  border: 2px solid #00ff99;
  box-shadow: 0 0 25px #00ff99;
}

#ui {
  position: absolute;
  top: 10px;
  left: 10px;
  font-size: 14px;
}

#startScreen {
  position: fixed;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle, #111, #000);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 10;
}

button {
  padding: 12px 25px;
  background: #00ff99;
  border: none;
  border-radius: 10px;
  color: black;
  font-weight: bold;
}
</style>
</head>

<body>

<div id="startScreen">
  <h1>🐍 Round Snake</h1>
  <button onclick="startGame()">Play</button>
</div>

<div id="ui">
  Score: <span id="score">0</span><br>
  High: <span id="high">0</span>
</div>

<canvas id="game" width="420" height="420"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const box = 20;

let snake, dir, food, score, high, loop;

high = localStorage.getItem("snakeHigh") || 0;
document.getElementById("high").innerText = high;

/* INIT */
function init() {
  snake = [{x: 10*box, y: 10*box}];
  dir = "RIGHT";
  food = spawnFood();
  score = 0;
  updateUI();
}

/* SAFE FOOD SPAWN */
function spawnFood() {
  return {
    x: Math.floor(Math.random() * (canvas.width / box)) * box,
    y: Math.floor(Math.random() * (canvas.height / box)) * box
  };
}

/* CONTROLS */
document.addEventListener("keydown", e => {
  if (e.key==="ArrowLeft" && dir!=="RIGHT") dir="LEFT";
  if (e.key==="ArrowRight" && dir!=="LEFT") dir="RIGHT";
  if (e.key==="ArrowUp" && dir!=="DOWN") dir="UP";
  if (e.key==="ArrowDown" && dir!=="UP") dir="DOWN";
});

/* SWIPE */
let sx, sy;
document.addEventListener("touchstart", e=>{
  sx=e.touches[0].clientX;
  sy=e.touches[0].clientY;
});

document.addEventListener("touchend", e=>{
  let dx=e.changedTouches[0].clientX-sx;
  let dy=e.changedTouches[0].clientY-sy;

  if(Math.abs(dx)>Math.abs(dy)){
    if(dx>0 && dir!=="LEFT") dir="RIGHT";
    else if(dx<0 && dir!=="RIGHT") dir="LEFT";
  } else {
    if(dy>0 && dir!=="UP") dir="DOWN";
    else if(dy<0 && dir!=="DOWN") dir="UP";
  }
});

/* DRAW ROUND CIRCLE */
function drawCircle(x,y,color){
  ctx.fillStyle=color;
  ctx.beginPath();
  ctx.arc(x + box/2, y + box/2, box/2.2, 0, Math.PI*2);
  ctx.fill();
}

/* GAME LOOP */
function game(){

  ctx.fillStyle="#000";
  ctx.fillRect(0,0,420,420);

  // grid
  ctx.strokeStyle="#111";
  for(let i=0;i<420;i+=box){
    ctx.beginPath();
    ctx.moveTo(i,0);
    ctx.lineTo(i,420);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(0,i);
    ctx.lineTo(420,i);
    ctx.stroke();
  }

  // move head
  let head={...snake[0]};

  if(dir==="RIGHT") head.x+=box;
  if(dir==="LEFT") head.x-=box;
  if(dir==="UP") head.y-=box;
  if(dir==="DOWN") head.y+=box;

  // collision
  if(head.x<0||head.y<0||head.x>=420||head.y>=420) return die();

  for(let i=0;i<snake.length;i++){
    if(head.x===snake[i].x && head.y===snake[i].y) return die();
  }

  snake.unshift(head);

  // eat food
  if(head.x===food.x && head.y===food.y){
    score++;
    food=spawnFood();
  } else {
    snake.pop();
  }

  // draw food (round apple)
  drawCircle(food.x, food.y, "#ff3333");

  // draw snake (ROUND)
  for(let i=0;i<snake.length;i++){
    drawCircle(
      snake[i].x,
      snake[i].y,
      i===0 ? "#00ffcc" : "#00aa88"
    );
  }

  updateUI();
}

/* UI */
function updateUI(){
  document.getElementById("score").innerText=score;

  if(score>high){
    high=score;
    localStorage.setItem("snakeHigh",high);
    document.getElementById("high").innerText=high;
  }
}

/* START */
function startGame(){
  document.getElementById("startScreen").style.display="none";
  init();
  loop=setInterval(game,120);
}

/* GAME OVER */
function die(){
  clearInterval(loop);
  alert("Game Over! Score: "+score);
  document.getElementById("startScreen").style.display="flex";
}
</script>

</body>
</html>
