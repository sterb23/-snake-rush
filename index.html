<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Game Pro</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0b0b0b;
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  flex-direction: column;
}

canvas {
  background: #000;
  border: 2px solid #00ff99;
  box-shadow: 0 0 20px #00ff99;
}

#ui {
  margin-top: 10px;
  text-align: center;
}

button {
  padding: 10px 20px;
  margin-top: 10px;
  border: none;
  background: #00aa66;
  color: white;
  border-radius: 8px;
  cursor: pointer;
}

#startScreen {
  position: absolute;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.95);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}
</style>
</head>

<body>

<div id="startScreen">
  <h1>🐍 Snake Pro</h1>
  <button onclick="startGame()">Start</button>
</div>

<canvas id="game" width="400" height="400"></canvas>

<div id="ui">
  <div>Score: <span id="score">0</span></div>
  <div>High Score: <span id="highScore">0</span></div>
  <div>Speed: <span id="speed">1</span></div>
  <button onclick="restart()">Restart</button>
</div>

<!-- SOUND -->
<audio id="eatSound" src="https://actions.google.com/sounds/v1/cartoon/pop.ogg"></audio>
<audio id="gameOverSound" src="https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg"></audio>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const box = 20;

let snake, direction, food, bonusFood, score, speed, game;

let highScore = localStorage.getItem("snakeHigh") || 0;
document.getElementById("highScore").innerText = highScore;

const eatSound = document.getElementById("eatSound");
const gameOverSound = document.getElementById("gameOverSound");

function init() {
  snake = [{ x: 9 * box, y: 9 * box }];
  direction = "RIGHT";
  score = 0;
  speed = 1;

  food = randomFood();
  bonusFood = null;

  document.getElementById("score").innerText = score;
  document.getElementById("speed").innerText = speed;
}

function randomFood() {
  return {
    x: Math.floor(Math.random() * 20) * box,
    y: Math.floor(Math.random() * 20) * box
  };
}

// KEYBOARD
document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowLeft" && direction !== "RIGHT") direction = "LEFT";
  if (e.key === "ArrowRight" && direction !== "LEFT") direction = "RIGHT";
  if (e.key === "ArrowUp" && direction !== "DOWN") direction = "UP";
  if (e.key === "ArrowDown" && direction !== "UP") direction = "DOWN";
});

// SWIPE
let startX, startY;

document.addEventListener("touchstart", e => {
  startX = e.touches[0].clientX;
  startY = e.touches[0].clientY;
});

document.addEventListener("touchend", e => {
  let dx = e.changedTouches[0].clientX - startX;
  let dy = e.changedTouches[0].clientY - startY;

  if (Math.abs(dx) > Math.abs(dy)) {
    if (dx > 0 && direction !== "LEFT") direction = "RIGHT";
    else if (dx < 0 && direction !== "RIGHT") direction = "LEFT";
  } else {
    if (dy > 0 && direction !== "UP") direction = "DOWN";
    else if (dy < 0 && direction !== "DOWN") direction = "UP";
  }
});

// GAME LOOP
function draw() {
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, 400, 400);

  // snake
  for (let i = 0; i < snake.length; i++) {
    ctx.fillStyle = i === 0 ? "#00ff99" : "#00aa66";
    ctx.fillRect(snake[i].x, snake[i].y, box, box);
  }

  // food
  ctx.fillStyle = "red";
  ctx.fillRect(food.x, food.y, box, box);

  // bonus food (yellow, rare)
  if (score > 0 && score % 5 === 0) {
    if (!bonusFood) bonusFood = randomFood();

    ctx.fillStyle = "yellow";
    ctx.fillRect(bonusFood.x, bonusFood.y, box, box);
  } else {
    bonusFood = null;
  }

  let headX = snake[0].x;
  let headY = snake[0].y;

  if (direction === "LEFT") headX -= box;
  if (direction === "RIGHT") headX += box;
  if (direction === "UP") headY -= box;
  if (direction === "DOWN") headY += box;

  // eat normal food
  if (headX === food.x && headY === food.y) {
    score++;
    eatSound.play();

    food = randomFood();

    increaseSpeed();
  }

  // eat bonus food
  if (bonusFood && headX === bonusFood.x && headY === bonusFood.y) {
    score += 3;
    eatSound.play();
    bonusFood = null;
    increaseSpeed();
  }

  else {
    snake.pop();
  }

  let newHead = { x: headX, y: headY };

  // collision wall
  if (headX < 0 || headX >= 400 || headY < 0 || headY >= 400) {
    return endGame();
  }

  // collision self
  for (let i = 0; i < snake.length; i++) {
    if (headX === snake[i].x && headY === snake[i].y) {
      return endGame();
    }
  }

  snake.unshift(newHead);

  document.getElementById("score").innerText = score;
}

function increaseSpeed() {
  if (score % 3 === 0) {
    speed++;
    document.getElementById("speed").innerText = speed;

    clearInterval(game);
    game = setInterval(draw, Math.max(60, 120 - speed * 10));
  }
}

function startGame() {
  document.getElementById("startScreen").style.display = "none";
  init();
  game = setInterval(draw, 120);
}

function restart() {
  clearInterval(game);
  init();
  game = setInterval(draw, 120);
}

function endGame() {
  clearInterval(game);
  gameOverSound.play();

  if (score > highScore) {
    highScore = score;
    localStorage.setItem("snakeHigh", highScore);
    document.getElementById("highScore").innerText = highScore;
  }

  alert("Game Over! Score: " + score);
  document.getElementById("startScreen").style.display = "flex";
}
</script>

</body>
</html>
